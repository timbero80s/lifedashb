<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20241d">
  <title>Wall Dashboard</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- the "case" / bezel around the LCD -->
  <div class="device" id="device">
    <div class="brand">
      <span class="brand-mark">WALL&middot;BANK</span>
      <span class="brand-sub">DASHBOARD MODULE</span>
      <span class="brand-status" id="net-status" title="data status">&#9679;</span>
    </div>

    <!-- the LCD itself -->
    <main class="lcd" id="lcd">

      <!-- top strip: date + big clock -------------------------------------->
      <section class="panel panel--clock" id="p-clock">
        <div class="clock-left">
          <div class="dow" id="dow-row"><!-- MO TU WE ... --></div>
          <div class="date-line" id="date-line">--- -- --- ----</div>
          <div class="sub-line"><span id="week-label">WK --</span> &nbsp;&middot;&nbsp; <span id="doy-label">DAY ---</span></div>
        </div>
        <div class="clock-main">
          <span class="time-big" id="time-big">00:00</span><span class="time-sec" id="time-sec">00</span>
        </div>
        <div class="clock-right">
          <div class="now-temp" id="now-temp">--&deg;</div>
          <div class="now-place" id="now-place">--</div>
          <div class="now-cond" id="now-cond">&mdash;</div>
        </div>
      </section>

      <!-- weather -------------------------------------------------------->
      <section class="panel" id="p-weather">
        <header class="panel__label">WEATHER</header>
        <div class="panel__body" id="weather-body"><div class="loading">reading&hellip;</div></div>
      </section>

      <!-- calendar (tall) --------------------------------------------->
      <section class="panel panel--calendar" id="p-calendar">
        <header class="panel__label">WEEK &mdash; <span id="cal-range">--</span></header>
        <div class="panel__body" id="calendar-body"><div class="loading">reading&hellip;</div></div>
      </section>

      <!-- astro (moon / sun) ---------------------------------------->
      <section class="panel" id="p-astro">
        <header class="panel__label">MOON &amp; SUN</header>
        <div class="panel__body" id="astro-body"><div class="loading">reading&hellip;</div></div>
      </section>

      <!-- football (tall) ------------------------------------------->
      <section class="panel panel--football" id="p-football">
        <header class="panel__label">TABLES &amp; FIXTURES</header>
        <div class="panel__body" id="football-body"><div class="loading">reading&hellip;</div></div>
      </section>

      <!-- ISS ----------------------------------------------------->
      <section class="panel" id="p-iss">
        <header class="panel__label">ISS &mdash; NEXT PASS</header>
        <div class="panel__body" id="iss-body"><div class="loading">reading&hellip;</div></div>
      </section>

      <!-- trains ------------------------------------------------->
      <section class="panel" id="p-trains">
        <header class="panel__label">MAIDENHEAD &nbsp;&#8646;&nbsp; LONDON</header>
        <div class="panel__body" id="trains-body"><div class="loading">reading&hellip;</div></div>
      </section>

      <!-- ticker ----------------------------------------------->
      <section class="panel panel--ticker" id="p-news">
        <div class="ticker-tag" id="news-tag">TECH</div>
        <div class="ticker-view"><div class="ticker-item" id="news-item">loading positive tech&hellip;</div></div>
      </section>

    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
