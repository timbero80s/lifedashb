<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0F12">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Authored at a fixed 2000x1200. app.js scales the root to the real viewport,
     so every px below is a true pixel on the Fire Max 11. -->
<div id="app">

  <!-- ── hero strip ─────────────────────────────────────────────── -->
  <header class="hero">
    <div class="hero__left">
      <div class="hero__clock" id="clock">--:--</div>
      <div class="hero__date" id="date-line">&nbsp;</div>
    </div>
    <div class="hero__alert" id="alert-lane" hidden></div>
    <div class="hero__right">
      <div class="hero__temp" id="now-temp">--&deg;</div>
      <div class="hero__cond" id="now-cond">&nbsp;</div>
      <div class="hero__place"><span id="now-place">MAIDENHEAD</span> <i class="dot" id="net-dot"></i></div>
    </div>
  </header>

  <!-- ── body grid ─────────────────────────────────────────────── -->
  <main class="body">

    <section class="card" style="grid-area:cal" id="c-cal">
      <div class="card__label">Calendar</div>
      <div class="card__body" id="calendar-body"></div>
    </section>

    <section class="card" style="grid-area:tr" id="c-tr">
      <div class="card__label">Maidenhead trains</div>
      <div class="card__body" id="trains-body"></div>
    </section>

    <section class="card" style="grid-area:wx" id="c-wx">
      <div class="card__label">Outlook</div>
      <div class="card__body" id="weather-body"></div>
    </section>

    <section class="card" style="grid-area:as" id="c-as">
      <div class="card__label">Sun &amp; moon</div>
      <div class="card__body" id="astro-body"></div>
    </section>

    <section class="card" style="grid-area:hh" id="c-hh">
      <div class="card__label">Today in the house</div>
      <div class="card__body" id="house-body"></div>
    </section>

    <section class="card" style="grid-area:fb" id="c-fb">
      <div class="card__label">Football</div>
      <div class="card__body" id="football-body"></div>
    </section>

    <section class="card" style="grid-area:f1" id="c-f1">
      <div class="card__label">Formula 1</div>
      <div class="card__body" id="f1-body"></div>
    </section>

    <section class="card" style="grid-area:iss" id="c-iss">
      <div class="card__label">ISS</div>
      <div class="card__body" id="iss-body"></div>
    </section>

    <section class="card" style="grid-area:mus" id="c-mus">
      <div class="card__label">Music</div>
      <div class="card__body" id="music-body"></div>
    </section>

  </main>
</div>

<!-- ── night face (23:00–06:30) ──────────────────────────────── -->
<div id="nightface" hidden>
  <div class="nf__clock" id="nf-clock">--:--</div>
  <div class="nf__next" id="nf-next">&nbsp;</div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
